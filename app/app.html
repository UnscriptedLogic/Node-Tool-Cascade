<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cascade — design tree</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<!--STYLES-->
</head>
<body>
<div id="app">
  <div id="railRoot" class="cui" style="display:contents"></div>

  <main id="stage" aria-label="Design tree canvas">
    <div id="grid" aria-hidden="true"></div>
    <div id="world">
      <svg id="edges" aria-hidden="true">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" style="stroke:var(--ink2)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <g id="eg"></g><g id="th"></g>
        <text id="elabel" class="elabel"></text>
      </svg>
    </div>

    <div id="hudRoot" class="cui" style="display:contents"></div>

    <div id="sideRoot" class="cui"></div>

    <div id="composeRoot" class="cui" style="display:contents"></div>
  </main>
</div>

<div id="menuRoot" class="cui"></div>

<div id="settingsRoot" class="cui"></div>

<div id="sourceRoot" class="cui"></div>

<div id="bye" hidden><div class="card"><b>Cascade has stopped.</b><p>The port is free again. You can close this tab. Run the start script to open it again.</p></div></div>

<!--RUNTIME-->
<!--SCRIPTS-->
</body>
</html>
