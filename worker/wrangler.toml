# Cascade on Cloudflare: one Worker serves the web app (static files) and the /api routes, with D1 for storage.
# Deploy steps are in worker/README.md.
name = "cascade"
main = "src/index.js"
compatibility_date = "2025-01-01"

routes = [{ pattern = "cascade.unscriptedlogic.com", custom_domain = true }]

[assets]
directory = "../dist/web"          # created by `npm run build`
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cascade"
database_id = "87c74242-a137-4b3a-bc4f-fe8551a5dbbe"   # printed by `wrangler d1 create cascade`

[vars]
GOOGLE_CLIENT_ID = "349036731762-9de8ibpl3761plhjeer80n6c0nekljv1.apps.googleusercontent.com"
