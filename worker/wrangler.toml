# Cascade on Cloudflare: one Worker serves the web app (static files) and the /api routes, with D1 for storage.
# Two deployments, each with its own database so testing never touches real data:
#   production  (main branch)  cascade.unscriptedlogic.com       npm run worker:deploy
#   dev         (dev branch)   cascade-dev.unscriptedlogic.com   npm run worker:deploy:dev
# Deploy steps are in worker/README.md.
name = "cascade"
main = "src/index.js"
compatibility_date = "2025-01-01"
routes = [{ pattern = "cascade.unscriptedlogic.com", custom_domain = true }]

[assets]
directory = "../dist/web"          # created by `npm run build`
binding = "ASSETS"
# the page itself goes through the Worker too, so the page-view counter can be added to it
run_worker_first = ["/api/*", "/", "/index.html", "/admin", "/admin/"]

[[d1_databases]]
binding = "DB"
database_name = "cascade"
database_id = "87c74242-a137-4b3a-bc4f-fe8551a5dbbe"

# anonymous usage counts (see worker/src/analytics.js)
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "cascade_events"

[vars]
GOOGLE_CLIENT_ID = "349036731762-9de8ibpl3761plhjeer80n6c0nekljv1.apps.googleusercontent.com"
ENV_NAME = "prod"
# Cloudflare Web Analytics site token for this hostname (public, not a secret). Empty means no page-view counting.
CF_BEACON_TOKEN = "d9ce13a83c5645e5860b7e15b497d390"

# ---- dev: bindings are not inherited, so they are repeated ----
[env.dev]
name = "cascade-dev"
routes = [{ pattern = "cascade-dev.unscriptedlogic.com", custom_domain = true }]

[env.dev.assets]
directory = "../dist/web"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/index.html", "/admin", "/admin/"]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "cascade-dev"
database_id = "1a2b3615-81f0-4662-842e-75547d5ea902"

[[env.dev.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "cascade_events_dev"

[env.dev.vars]
GOOGLE_CLIENT_ID = "349036731762-9de8ibpl3761plhjeer80n6c0nekljv1.apps.googleusercontent.com"
ENV_NAME = "dev"
CF_BEACON_TOKEN = "187a70a7291e42598d9312d734d5779c"
